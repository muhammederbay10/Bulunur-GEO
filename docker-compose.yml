services:
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: bulunur-ai
    env_file:
      - ./ai/.env
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
